name: Build Nokia Emulator APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NokiaEmulator_project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3 accept-sdk-licenses: true сразу под uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -o NokiaEmulator_project.zip -d extracted

      - name: Build debug APK
        working-directory: extracted/NokiaEmulator
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nokia-Emulator-APK
          path: extracted/NokiaEmulator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
